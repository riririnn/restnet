# --- Program ---
program_seed=0
program_auto_seed=false
program_quiet=false

# --- Actor ---
actor_num_simulation=50
actor_mcts_puct_base=19652
actor_mcts_puct_init=1.25
actor_mcts_reward_discount=1
actor_mcts_value_rescale=false
actor_select_action_by_count=false
actor_select_action_by_softmax_count=true
actor_select_action_softmax_temperature=1
actor_use_random_rotation_features=true
actor_use_dirichlet_noise=false # Gumbel AlphaZero replaces it; leaving it on suppresses the Gumbel noise entirely (zero_actor.cpp:206)
actor_dirichlet_noise_alpha=0.03
actor_dirichlet_noise_epsilon=0.25
actor_use_gumbel=true
actor_use_gumbel_noise=true
actor_gumbel_sample_size=16
actor_gumbel_sigma_visit_c=50
actor_gumbel_sigma_scale_c=1
actor_resign_threshold=-0.9

# --- Zero (並列数を抑えてメモリを保護) ---
zero_num_threads=1
zero_num_parallel_games=1
zero_num_games_per_iteration=2
zero_replay_buffer=1
zero_disable_resign_ratio=0.1

# --- Learner (バッチサイズを下げてメモリ不足を回避) ---
learner_use_per=false
learner_training_step=10
learner_batch_size=64
learner_optimizer=SGD
learner_learning_rate=0.02
learner_momentum=0.9
learner_weight_decay=0.0001
learner_value_loss_scale=1.0
learner_num_thread=4

# --- Network (将棋の巨大なデータに対応させるため小規模に設定) ---
nn_num_blocks=1
nn_num_hidden_channels=64
nn_num_value_hidden_channels=64
nn_type_name=alphazero
nn_embed_kernel_size=3
nn_blocks_type=R_R_T_R_R_T
nn_policy_type=P
nn_value_type=TV
nn_bv_flag=false

# --- Environment ---
env_board_size=9