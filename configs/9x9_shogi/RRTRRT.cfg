# MiniZero / ResTNet - Lightweight Test Config for Shogi

# Environment Settings
env_board_size=9

# Network Architecture Settings (ResTNet)
nn_num_blocks=1
nn_num_hidden_channels=64        # 256から64に減らす
nn_num_value_hidden_channels=64  # 256から64に減らす
nn_embed_kernel_size=3
nn_blocks_type=R_R_T_R_R_T
nn_policy_type=P
nn_value_type=TV
nn_bv_flag=false

# Lightweight Training Settings (PC負荷を極限まで下げるテスト用)
zero_num_threads=1               # 4から1に減らす
zero_num_parallel_games=2        # 64から2に減らす
zero_num_games_per_iteration=2
zero_end_iteration=2
learner_training_step=10
actor_num_simulation=50